services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marquee
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marquee"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - marquee-postgres:/var/lib/postgresql/data

volumes:
  marquee-postgres:
